name: qcai-quantum
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  - jupyter>=1.0.0
  - notebook>=7.0.0
  - jupyterlab>=4.0.0
  - pip:
      # Quantum Computing
      - qiskit>=1.0.0,<2.0.0
      - qiskit-aer>=0.13.0,<1.0.0

      # Scientific Computing
      - numpy>=1.24.0,<2.0.0
      - matplotlib>=3.7.0,<4.0.0
      - seaborn>=0.12.0

      # Jupyter Extensions
      - ipywidgets>=8.0.0
      - ipykernel>=6.25.0

      # Testing (optional for Binder, but included for completeness)
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - nbmake>=1.4.0
