[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    skip_starter: skip starter notebook tests (incomplete by design)
    integration: marks tests as integration tests
    statistical: tests that use statistical validation

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=notebooks
    --cov-report=html
    --cov-report=term-missing

# Increase timeout for quantum simulations
timeout = 300

# Configure warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
